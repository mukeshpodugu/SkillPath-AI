services:
  # 1. Python Native Web Service (FastAPI Backend)
  - type: web
    name: skillpath-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2

  # 2. Static Web Site (React Frontend)
  - type: web
    name: skillpath-frontend
    runtime: static
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://skillpath-backend-1d08.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

